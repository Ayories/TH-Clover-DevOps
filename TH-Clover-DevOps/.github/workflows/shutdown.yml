name: Non-production shutdown
on:
  schedule:
    - cron: '0 19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shutdown:
    runs-on: ubuntu-latest
    environment: staging-shutdown
    steps:
      - name: Stop staging containers
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY"
          install -m 600 /dev/null key.pem
          printf '%s\n' "$SSH_KEY" > key.pem
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i key.pem "$USER@$HOST" 'cd /opt/th-clover && docker compose --env-file secrets.env --env-file release.env -f docker-compose.yml stop app db'
