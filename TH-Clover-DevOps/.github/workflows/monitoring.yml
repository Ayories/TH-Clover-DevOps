name: Staging uptime probe
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public staging endpoint if configured
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo 'STAGING_HEALTH_URL not configured'; exit 1; }
          curl --fail --show-error --max-time 10 --retry 2 "$HEALTH_URL"
