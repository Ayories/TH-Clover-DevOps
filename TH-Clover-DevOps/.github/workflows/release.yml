name: Publish verified image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt && ruff check app tests && pytest -q
      - run: docker build -t th-clover:release .
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: th-clover:release
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image and save digest
        id: publish
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag th-clover:release "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}" | tee push.log
          DIGEST_VALUE=$(sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' push.log | tail -1)
          test -n "$DIGEST_VALUE" || exit 1
          DIGEST="$IMAGE@$DIGEST_VALUE"
          echo "APP_IMAGE=$DIGEST" >> "$GITHUB_OUTPUT"
          printf 'APP_IMAGE=%s\nRELEASE_SHA=%s\n' "$DIGEST" "$GITHUB_SHA" > release.env
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.env
