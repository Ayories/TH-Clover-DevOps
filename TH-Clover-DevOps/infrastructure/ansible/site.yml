- name: Prepare Linux staging host
  hosts: staging
  become: true
  tasks:
    - name: Install Docker packages (Ubuntu)
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        update_cache: true
        state: present
    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Create deployment directory
      ansible.builtin.file:
        path: /opt/th-clover
        state: directory
        mode: '0750'
