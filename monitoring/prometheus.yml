# TH-CLOVER Prometheus (AI-assisted). Two application environments on one host.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: clover
    metrics_path: /metrics
    static_configs:
      - targets: ['staging-app:8000']
        labels:
          environment: staging
      - targets: ['production-app:8000']
        labels:
          environment: production

  # Notification counters (sent and failed), used by the failure-detection drill.
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
