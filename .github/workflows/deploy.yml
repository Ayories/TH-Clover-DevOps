# Deploys an already built and scanned image. No SSH and no long-lived AWS keys: GitHub OIDC assumes
# a role that may only run the th-clover-deploy SSM document (infrastructure/cloudformation).
name: Deploy

run-name: Deploy ${{ inputs.release_sha }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      image_digest:
        description: 'Image digest from the release run: sha256:... (or ghcr.io/ayories/th-clover-devops@sha256:...)'
        type: string
        required: true
      release_sha:
        description: Full 40-character commit SHA on main that the image was built from
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  IMAGE_REPO: ghcr.io/ayories/th-clover-devops

jobs:
  verify:
    name: Verify release (environment approval)
    runs-on: ubuntu-latest
    # Add required reviewers to the GitHub environment to make this an approval gate.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    outputs:
      image_ref: ${{ steps.check.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs and check the commit is on main
        id: check
        env:
          INPUT_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail 'Run this workflow from the main branch.'
          digest="${INPUT_DIGEST#"$IMAGE_REPO@"}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || fail 'image_digest must be a sha256 digest of this repository image.'
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail 'release_sha must be a full 40-character commit SHA.'
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || fail 'release_sha is not on main.'
          echo "image_ref=$IMAGE_REPO@$digest" >> "$GITHUB_OUTPUT"

      - name: Check the digest is the image published for that commit
        env:
          IMAGE_REF: ${{ steps.check.outputs.image_ref }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          published=$(docker buildx imagetools inspect "$IMAGE_REPO:$RELEASE_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          if [[ "$IMAGE_REF" != "$IMAGE_REPO@$published" ]]; then
            echo "::error::Tag $RELEASE_SHA has digest $published, not the digest requested."
            exit 1
          fi

  deploy:
    name: Deploy through AWS Systems Manager
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Do not add "environment:" to this job: it would change the OIDC subject from
    # ref:refs/heads/main and AWS would refuse the role. Approval happens in "verify".
    permissions:
      id-token: write
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_REF: ${{ needs.verify.outputs.image_ref }}
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - name: Record start time
        run: |
          echo "STARTED=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          echo "STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Assume the deploy role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: th-clover-deploy-${{ github.run_id }}

      - name: Send the deploy command
        run: |
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=th-clover Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [[ ! "$instance_id" =~ ^i-[0-9a-f]+$ ]]; then
            echo "::error::Expected exactly one running instance named th-clover (is it stopped?). Found: '$instance_id'"
            exit 1
          fi
          parameters=$(jq -cn --arg e "$ENVIRONMENT" --arg i "$IMAGE_REF" --arg s "$RELEASE_SHA" \
            '{Environment: [$e], ImageRef: [$i], ReleaseSha: [$s]}')
          command_id=$(aws ssm send-command --document-name th-clover-deploy \
            --instance-ids "$instance_id" --parameters "$parameters" \
            --comment "GitHub run $GITHUB_RUN_ID" --query Command.CommandId --output text)
          echo "INSTANCE_ID=$instance_id" >> "$GITHUB_ENV"
          echo "COMMAND_ID=$command_id" >> "$GITHUB_ENV"
          echo "Command $command_id sent to $instance_id"

      - name: Wait for the result
        run: |
          get() {
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "$1" --output text
          }
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            # The invocation can take a few seconds to appear.
            status=$(get Status 2>/dev/null || echo Pending)
            case "$status" in Success | Failed | Cancelled | TimedOut) break ;; esac
          done
          echo "SSM_STATUS=$status" >> "$GITHUB_ENV"
          echo "EXIT_CODE=$(get ResponseCode || echo unknown)" >> "$GITHUB_ENV"
          echo '--- deploy.sh output'
          get StandardOutputContent || true
          echo '--- deploy.sh errors and progress'
          get StandardErrorContent || true
          if [[ "$status" != Success ]]; then
            echo "::error::Deployment $status. Exit code 10 = rolled back, 11 = rollback failed; see deploy.sh."
            exit 1
          fi

      - name: Write timings to the job summary
        if: always()
        run: |
          finished=$(date -u +%FT%TZ)
          {
            echo '## Deployment record'
            echo '| Field | Value |'
            echo '|---|---|'
            echo "| Environment | $ENVIRONMENT |"
            echo "| Commit | $RELEASE_SHA |"
            echo "| Image | $IMAGE_REF |"
            echo "| Triggered by | $GITHUB_ACTOR |"
            echo "| Started (UTC) | ${STARTED:-unknown} |"
            echo "| Finished (UTC) | $finished |"
            echo "| Duration (s) | $(($(date +%s) - ${STARTED_EPOCH:-$(date +%s)})) |"
            echo "| SSM status | ${SSM_STATUS:-not sent} |"
            echo "| Script exit code | ${EXIT_CODE:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
