# Continuous integration for every pull request and push to main. AI-assisted.
# Third-party actions are pinned to full commit SHAs (the comment gives the release).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Unit and integration tests with coverage
        run: >-
          pytest -q tests
          --junitxml=pytest-results.xml
          --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-test-results
          path: |
            pytest-results.xml
            coverage.xml
      - name: Build container image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t th-clover:ci .
      - name: Smoke test the container (non-root, health, revision label)
        run: |
          set -euo pipefail
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db -e RELEASE_SHA="$GITHUB_SHA" th-clover:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [[ "$status" == healthy ]] && break
            sleep 2
          done
          [[ "$status" == healthy ]]
          response=$(curl --fail --silent --show-error http://127.0.0.1:8000/health)
          [[ "$response" == *'"status":"ok"'* && "$response" == *"$GITHUB_SHA"* ]]
          [[ "$(docker exec smoke id -u)" == 10001 ]]
          label=$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' smoke)
          [[ "$label" == "$GITHUB_SHA" ]]

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        env:
          POSTGRES_DB: clover_test
          # Throwaway database that exists only for this job, so no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clover_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Integration tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/clover_test
        run: pytest -q tests/test_app.py --junitxml=pytest-postgres.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-test-results
          path: pytest-postgres.xml
