# Copy to inventory.ini (git-ignored) and replace the two placeholder values.
[clover]
# The public IP changes after a stop/start: copy the current one from the EC2 console.
th-clover ansible_host=203.0.113.25

[clover:vars]
ansible_user=cloveradmin
# Keep the private key inside WSL (not under /mnt/c) with permission 600.
ansible_ssh_private_key_file=~/.ssh/th_clover_ed25519
ansible_python_interpreter=/usr/bin/python3
# Stack output SnsTopicArn
sns_topic_arn=arn:aws:sns:eu-north-1:123456789012:th-clover-alerts
