# One definition for development, staging and production. Only the variables differ.
# Server: scripts/deploy.sh supplies secrets.env + release.env and the awslogs override.
# Laptop: see docker-compose.local.yml.
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable image digest}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      RELEASE_SHA: ${RELEASE_SHA:?}
      APP_ENV: ${APP_ENV:?}
      SECRET_KEY: ${SECRET_KEY:?}
      STAFF_USERNAME: ${STAFF_USERNAME:-staff}
      # Empty means staff access is refused.
      STAFF_PASSWORD_HASH: ${STAFF_PASSWORD_HASH:-}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:?}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
      clover-monitoring:
        aliases:
          - ${APP_ENV:?}-app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:

networks:
  # Shared with the monitoring stack so Prometheus can reach <env>-app. Not published to the host.
  clover-monitoring:
    external: true
